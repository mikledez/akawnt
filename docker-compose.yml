version: "3.8"
services:
    web:
        build: .
        ports:
            - "8080:80"
        depends_on:
            - db
        environment:
            - DB_HOST=db
            - DB_DATABASE=akawnt
            - DB_USERNAME=root
            - DB_PASSWORD=root_password

    db:
        image: mysql:8.0
        environment:
            - MYSQL_ROOT_PASSWORD=root_password
            - MYSQL_DATABASE=akawnt
        ports:
            - "3307:3306"
        volumes:
            - db_data:/var/lib/mysql

    phpmyadmin:
        image: phpmyadmin:latest
        ports:
            - "8081:80"
        depends_on:
            - db
        environment:
            - PMA_HOST=db
            - PMA_USER=root
            - PMA_PASSWORD=root_password

volumes:
    db_data: